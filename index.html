<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal To-Do List</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-pink-50 flex items-center justify-center p-5">

    <!-- Main Container -->
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl p-6">

        <!-- Heading -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-pink-600">
                🌸 My To-Do List
            </h1>

            <p class="text-gray-500 mt-2">
                Organize your daily tasks
            </p>
        </div>

        <!-- Add Task -->
        <div class="flex gap-2 mb-6">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
                class="flex-1 px-4 py-3 border-2 border-pink-200 rounded-xl
                       focus:outline-none focus:border-pink-500"
            >

            <button
                onclick="addTask()"
                class="bg-pink-500 text-white px-5 py-3 rounded-xl
                       hover:bg-pink-600 transition font-semibold">
                Add
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList" class="space-y-3">
            
            <!-- Example task -->
            <li class="flex items-center justify-between
                       bg-pink-50 p-4 rounded-xl">

                <span class="task-text">
                    Complete practical file
                </span>

                <div class="flex gap-2">

                    <button
                        onclick="completeTask(this)"
                        class="bg-green-400 text-white px-3 py-1 rounded-lg
                               hover:bg-green-500">
                        ✓
                    </button>

                    <button
                        onclick="deleteTask(this)"
                        class="bg-red-400 text-white px-3 py-1 rounded-lg
                               hover:bg-red-500">
                        🗑
                    </button>

                </div>
            </li>

        </ul>

        <!-- Footer -->
        <div class="text-center mt-6">

            <p class="text-sm text-gray-400">
                Stay organized • Stay productive 💗
            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // Add a new task
        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            li.className =
                "flex items-center justify-between bg-pink-50 p-4 rounded-xl";

            li.innerHTML = `
                <span class="task-text">${task}</span>

                <div class="flex gap-2">

                    <button
                        onclick="completeTask(this)"
                        class="bg-green-400 text-white px-3 py-1 rounded-lg
                               hover:bg-green-500">
                        ✓
                    </button>

                    <button
                        onclick="deleteTask(this)"
                        class="bg-red-400 text-white px-3 py-1 rounded-lg
                               hover:bg-red-500">
                        🗑
                    </button>

                </div>
            `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }


        // Mark task as completed
        function completeTask(button) {

            let taskText =
                button.parentElement.parentElement.querySelector(".task-text");

            taskText.classList.toggle("line-through");
            taskText.classList.toggle("text-gray-400");
        }


        // Delete task
        function deleteTask(button) {

            button.parentElement.parentElement.remove();

        }


        // Press Enter to add task
        document.getElementById("taskInput").addEventListener("keypress",
            function(event) {

                if (event.key === "Enter") {
                    addTask();
                }

            }
        );

    </script>

</body>
</html>
